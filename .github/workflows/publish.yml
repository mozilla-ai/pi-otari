name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing-compatible npm
        run: npm install --global "npm@^11.5.1"

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run check

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(node --print 'require("./package.json").version')"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Publish package
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            npm publish --tag next
          else
            npm publish
          fi
